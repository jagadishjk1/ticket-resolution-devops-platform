name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ticket-resolution

jobs:
  # ------------------------------------------------------------------ static checks
  static-checks:
    name: Lint & static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Offline validation (YAML, JSON, shell, stack <-> Prometheus consistency)
        run: |
          pip install --quiet pyyaml yamllint
          bash scripts/validate.sh

      - name: ShellCheck
        run: shellcheck -x scripts/*.sh docker/entrypoint.sh

      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        working-directory: terraform
        run: |
          tflint --init
          tflint

      - name: IaC & Dockerfile misconfiguration scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: app
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  # ------------------------------------------------------------------ application tests
  app-tests:
    name: Application tests (upstream code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Frontend unit tests
        working-directory: app/frontend
        run: |
          npm install --no-audit --no-fund
          npm run test:run

      - name: Frontend production build
        working-directory: app/frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: "Backend - RAG engine loads the knowledge base"
        working-directory: app/backend
        run: |
          pip install -r requirements.txt
          python -c "from rag_engine_tfidf import RAGEngine; r = RAGEngine(); assert r.is_ready(), 'knowledge base not ready'; print('KB size:', r.get_knowledge_base_size())"

  # ------------------------------------------------------------------ image
  image:
    name: Build, scan, smoke-test, publish image
    runs-on: ubuntu-latest
    needs: [static-checks, app-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (local, for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ticket-resolution:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: |
          docker run -d --name app -p 8000:8000 ticket-resolution:ci
          RETRIES=24 bash scripts/smoke-test.sh http://localhost:8000 || { docker logs app; exit 1; }

      - name: Image vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ticket-resolution:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
