# Prometheus configuration for the Swarm stack.
#
# Swarm's internal DNS publishes "tasks.<service>" which resolves to the IP of
# every running task of a service. dns_sd_configs on those names gives
# per-replica (and per-node) discovery with no external service registry.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: ticket-swarm

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ---- Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---- Host metrics: one node-exporter task per Swarm node
  - job_name: node-exporter
    dns_sd_configs:
      - names: ["tasks.node-exporter"]
        type: A
        port: 9100

  # ---- Container metrics: one cAdvisor task per Swarm node
  - job_name: cadvisor
    dns_sd_configs:
      - names: ["tasks.cadvisor"]
        type: A
        port: 8080

  # ---- End-to-end availability through the Swarm VIP (what a client experiences)
  - job_name: app-health-service
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: ["http://app:8000/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---- Per-replica availability (bypasses the VIP, so one bad replica is visible)
  - job_name: app-health-tasks
    metrics_path: /probe
    params:
      module: [http_health]
    dns_sd_configs:
      - names: ["tasks.app"]
        type: A
        port: 8000
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
        replacement: "http://$1/health"
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---- Application business metrics: /api/metrics -> Prometheus (per replica)
  - job_name: app-metrics-summary
    metrics_path: /probe
    params:
      module: [ticket_summary]
    dns_sd_configs:
      - names: ["tasks.app"]
        type: A
        port: 8000
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
        replacement: "http://$1/api/metrics"
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979

  # ---- Application rolling stats: /api/metrics/realtime (last 100 queries)
  - job_name: app-metrics-realtime
    metrics_path: /probe
    params:
      module: [ticket_realtime]
    dns_sd_configs:
      - names: ["tasks.app"]
        type: A
        port: 8000
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
        replacement: "http://$1/api/metrics/realtime"
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979
