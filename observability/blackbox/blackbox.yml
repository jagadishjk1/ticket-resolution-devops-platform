modules:
  # /health returns 200 only when the RAG engine and knowledge base are loaded.
  http_health:
    prober: http
    timeout: 8s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"status"\s*:\s*"healthy"'
